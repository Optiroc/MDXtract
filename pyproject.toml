[project]
name = "MDXtract"
version = "0.1.0"
description = "MDXtract is a set of python tools for extracting instrument and sample data from files used by the MXDRV and PMD sound drivers."
readme = "README.md"
requires-python = ">=3.12,<=3.14"
dependencies = [
    "audioop-lts; python_version >= '3.13'",
]
